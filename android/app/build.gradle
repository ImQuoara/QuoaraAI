plugins {
    id 'com.android.application'
}

android {
    namespace 'com.imquoara.quoaraai'
    compileSdk 36

    defaultConfig {
        applicationId 'com.imquoara.quoaraai'
        minSdk 28
        targetSdk 36
        versionCode 11
        versionName '0.4.7-alpha'

        def configuredUrl = providers.gradleProperty('QUOARAAI_APP_URL').orNull ?: 'https://quoaraai.invalid'
        buildConfigField 'String', 'QUOARAAI_APP_URL', '"' + configuredUrl.replace('"', '\\"') + '"'
        buildConfigField 'String', 'QUOARAAI_SOURCE_BASELINE', '"001T"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
