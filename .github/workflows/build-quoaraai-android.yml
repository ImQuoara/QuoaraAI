name: Build QuoaraAi Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify source identity
        run: python3 tools/verify_source.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Generate APK proof report
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          PROOF="android/app/build/outputs/apk/debug/APK-PROOF.txt"
          test -f "$APK"
          {
            echo "QuoaraAi APK proof"
            echo "source_baseline=001T"
            echo "expected_package=com.imquoara.quoaraai"
            echo "expected_version_name=0.4.7-alpha"
            echo "expected_version_code=11"
            echo
            sha256sum "$APK"
            echo
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -20
            echo
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          } | tee "$PROOF"
          test -s "$PROOF"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuoaraAi-owner-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/APK-PROOF.txt
          if-no-files-found: error
          retention-days: 7
